<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Estándar – resultado</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F6F7F9;color:#111827;font-family:-apple-system,"SF Pro Text",Roboto,system-ui,sans-serif;position:relative}
.nav{padding:57px 20px 12px;display:flex;justify-content:space-between;align-items:center}
.nav b{font-size:28px;font-weight:700}
.nav span{font-size:13px;background:#DCFCE7;color:#166534;padding:4px 10px;border-radius:12px}
.photo{margin:8px 20px;height:180px;border-radius:20px;background:#E5E7EB}
.card{margin:16px 20px;background:#fff;border-radius:20px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:14px;align-items:center}
.bin{width:56px;height:56px;border-radius:16px;background:#FDE047}
.card h2{font-size:22px;font-weight:700}
.card p{font-size:15px;color:#6B7280;margin-top:2px}
.tip{margin-top:16px;font-size:15px;line-height:1.4;padding:12px;border-radius:12px;background:#F0FDF4;color:#166534}
.fab{position:absolute;left:50%;bottom:110px;margin-left:-36px;width:72px;height:72px;border-radius:50%;background:#16A34A}
.tabs{position:absolute;left:0;right:0;bottom:0;height:83px;background:#fff;border-top:1px solid #E5E7EB;display:flex;justify-content:space-around;padding-top:8px}
.tabs div{font-size:10px;text-align:center;color:#9CA3AF;width:70px}
.tabs div::before{content:"";display:block;width:24px;height:24px;margin:0 auto 4px;border-radius:12px;background:currentColor;opacity:.4}
.tabs .on{color:#16A34A}
</style></head><body>
<div class="nav"><b>Resultado</b><span>Köln</span></div>
<div class="photo"></div>
<div class="card">
  <div class="row"><div class="bin"></div><div><h2>Gelbe Tonne</h2><p>Botella de champú · 94%</p></div></div>
  <div class="tip">Vaciala. No hace falta lavarla. La tapa puede quedar puesta.</div>
</div>
<div class="fab"></div>
<div class="tabs"><div class="on">Escanear</div><div>Buscar</div><div>Historial</div><div>Perfil</div></div>
</body></html>
